site_name: Elidia CLI
site_description: Terminal AI agent with multi-model orchestration
site_url: https://aiutils.io/elidia
repo_url: https://github.com/aiutils/elidia-cli
repo_name: aiutils/elidia-cli

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: cyan
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - content.code.copy
    - content.code.annotate
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - attr_list
  - md_in_html
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
      - Configuration: getting-started/configuration.md
  - User Guide:
      - Chat & Modes: guide/chat-modes.md
      - Models: guide/models.md
      - Tools & MCP: guide/tools-mcp.md
      - Research: guide/research.md
      - Creative: guide/creative.md
      - Workflows: guide/workflows.md
      - Themes: guide/themes.md
  - Architecture:
      - Overview: architecture/overview.md
      - Module Map: architecture/modules.md
  - API Reference:
      - CLI Commands: api/commands.md
