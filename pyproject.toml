[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elidia-agent-cli"
version = "0.4.6"
description = "Elidia Agent CLI — Universal AI Agent for your terminal"
readme = "README.md"
license = "LicenseRef-Proprietary"
requires-python = ">=3.11"
authors = [{name = "Elidia Technology Pvt Ltd", email = "support@aiutils.io"}]
keywords = ["ai", "agent", "cli", "llm", "mcp", "coding-assistant", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx[http2]>=0.27",
    "keyring>=25.0",
    "sqlite-vec>=0.1.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "aiosmtpd>=1.4",
]
local = [
    "torch>=2.0",
    "diffusers>=0.27",
    "Pillow>=10.0",
]
rag = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "openpyxl>=3.1",
    "python-pptx>=0.6",
]
pdf = [
    "playwright>=1.45",
]
database = [
    "sqlalchemy>=2.0",
    "sqlparse>=0.5",
]
calendar = [
    "icalendar>=5.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[project.scripts]
elidia = "elidia.cli.main:cli"

[project.urls]
Homepage = "https://elidia.dev"
Repository = "https://github.com/Elidia-Technology/elidia-agent-cli"
Documentation = "https://docs.elidia.dev"
Issues = "https://github.com/Elidia-Technology/elidia-agent-cli/issues"
Changelog = "https://github.com/Elidia-Technology/elidia-agent-cli/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["."]
include = ["elidia*"]

[tool.setuptools.package-data]
elidia = ["py.typed"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["elidia"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
