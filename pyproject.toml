[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "elidia-cli"
version = "0.1.0"
description = "Elidia — Universal AI Agent for your terminal"
license = {text = "MIT"}
requires-python = ">=3.11"
authors = [{name = "AiUtils Team", email = "team@aiutils.io"}]
keywords = ["ai", "agent", "cli", "llm", "mcp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "prompt-toolkit>=3.0",
    "httpx>=0.27",
    "keyring>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[project.scripts]
elidia = "elidia.cli.main:cli"

[project.urls]
Homepage = "https://elidia.dev"
Repository = "https://github.com/aiutils/elidia-cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["elidia*"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.pytest.ini_options]
asyncio_mode = "auto"
